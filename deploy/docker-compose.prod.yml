# Production stack for the Hostinger VPS: Postgres + n8n + dashboard + Caddy (HTTPS) + nightly backups.
# Lives in /opt/fenebris on the server. All settings come from /opt/fenebris/.env (generated by `npm run deploy:init`).
# Only Caddy publishes ports (80/443). Postgres, n8n and the dashboard are reachable inside the compose network only.
name: fenebris

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fenebris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fenebris
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fenebris"]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    image: n8nio/n8n:2.40.5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: fenebris
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: "1"
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      GENERIC_TIMEZONE: ${TZ:-Asia/Kolkata}
      TZ: ${TZ:-Asia/Kolkata}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8ndata:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: ${APP_DIR:-./app}
      args:
        NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fenebris:${POSTGRES_PASSWORD}@db:5432/fenebris?schema=public
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      N8N_BASE_URL: http://n8n:5678
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
      GOOGLE_SHEET_URL: ${GOOGLE_SHEET_URL:-}
      GOOGLE_CALENDAR_URL: ${GOOGLE_CALENDAR_URL:-}
      BOOKING_LINK: ${BOOKING_LINK:-}
      TZ: ${TZ:-Asia/Kolkata}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - dashboard
      - n8n
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      N8N_DOMAIN: ${N8N_DOMAIN}
      DASH_USER: ${DASH_USER}
      DASH_PASS_HASH: ${DASH_PASS_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Daily pg_dump of both databases into /opt/fenebris/backups, 14 days kept. See deploy/backup.sh.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: db
      PGUSER: fenebris
      KEEP_DAYS: "14"
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  pgdata:
  n8ndata:
  caddy_data:
  caddy_config:
